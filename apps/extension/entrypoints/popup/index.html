<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadratic Helper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="popup">
      <header class="hdr">
        <img class="logo" src="/icons/icon-32.png" alt="Quadratic" width="22" height="22" />
        <span class="name">Quadratic Helper</span>
        <span class="pill pill--off" id="pill">
          <span class="dot"></span>
          <span id="pill-label">not a Quadratic site</span>
        </span>
      </header>

      <!-- INTERIM: hardcoded brand list until bridge handshake (QL-84).
           Replace with bridge:brand:set + capability-advertised options. -->
      <section class="section" id="section-brand">
        <div class="section-row">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path
              d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.4-.15-.74-.4-1-.25-.27-.4-.61-.4-1 0-.83.67-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8z"
            />
          </svg>
          <span class="section-label">Brand</span>
          <select id="brand-select" class="brand-select">
            <option value="current" style="font-style: italic">Current Theme</option>
            <option value="default">Default Theme</option>
            <option value="amplience">Amplience</option>
            <option value="anyafinn">Anya Finn</option>
            <option value="arbor-harvest">Arbor &amp; Harvest</option>
            <option value="azure-harvest">Azure Harvest</option>
            <option value="culinary-supply-hub">Culinary Supply Hub</option>
          </select>
        </div>
      </section>

      <section class="section" id="section-guides">
        <div class="section-row">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
          </svg>
          <label class="section-label" for="guides-containers">Containers</label>
          <label class="toggle" aria-label="Toggle container guides">
            <input type="checkbox" id="guides-containers" />
            <span class="toggle-knob"></span>
          </label>
        </div>
      </section>

      <footer class="bar">
        <span>v0.1.0</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
