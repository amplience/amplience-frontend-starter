name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test + coverage
        run: pnpm test:coverage

  docs-sync:
    name: Docs fixtures in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The /docs site pages are generated from the repo's docs/*.md (and README)
    # by `pnpm docs:generate`. Regenerate here and fail if anything changed —
    # this is the authoritative guarantee that the committed fixtures never fall
    # behind their Markdown source (the pre-commit hook is only a convenience).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.15.4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate docs fixtures
        run: pnpm docs:generate

      - name: Fail if generated docs are out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated docs are out of date. Run 'pnpm docs:generate' locally and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Docs fixtures are in sync with docs/*.md."
