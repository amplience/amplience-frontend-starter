# Gitleaks secret scanning.
#
# Two modes, picked by event:
#   - pull_request : scan only the PR diff (fast feedback for contributors)
#   - push to main : scan full git history (catches anything that slipped past PR scans
#                    and any direct pushes / merge edge cases)
#
# Config lives in .gitleaks.toml at the repo root. The job fails (non-zero exit) on any finding,
# which blocks merges when this workflow is added as a required check.
#
# Rationale: the original Quadratic codebase audit found ~7 credentials in history. Quadratic Lite
# is open-source from day one — a single leaked credential in `main` is effectively published. We
# fail closed.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; cancel superseded PR runs but never cancel `main` runs.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PRs: shallow checkout is fine, gitleaks-action handles base/head diff itself.
          # Push to main: fetch full history so the no-git scan covers everything.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The action's diff-vs-full-history behaviour is driven by the event type:
          #   pull_request -> scans the PR diff only
          #   push         -> scans full history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # We intentionally don't set GITLEAKS_LICENSE — gitleaks-action only requires it for
          # organisations >25 users; Amplience is exempt under the OSS clause for public repos.
