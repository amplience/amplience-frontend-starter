# Gitleaks secret scanning.
#
# Two modes, picked by event:
#   - pull_request : scan only the PR diff (fast feedback for contributors)
#   - push to main : scan full git history (catches anything that slipped past PR scans
#                    and any direct pushes / merge edge cases)
#
# Config lives in .gitleaks.toml at the repo root. The job fails (non-zero exit) on any finding,
# which blocks merges when this workflow is added as a required check.
#
# Rationale: the original Quadratic codebase audit found ~7 credentials in history. Amplience Frontend Starter
# is open-source from day one — a single leaked credential in `main` is effectively published. We
# fail closed.
#
# We run the gitleaks binary directly rather than gitleaks/gitleaks-action. The action requires a
# paid GITLEAKS_LICENSE for organisation-owned repos, and every third-party action also needs an
# entry in the Amplience enterprise allowlist. The binary needs neither.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; cancel superseded PR runs but never cancel `main` runs.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Pinned deliberately. gitleaks-action resolved "latest" at run time, so a new gitleaks
      # release could change CI behaviour with no commit here. Bump both values together —
      # the checksum is on the release page as gitleaks_<version>_checksums.txt.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for both events: the scan resolves a base..head commit range
          # and walks it with `git log`, so a shallow clone makes the range unresolvable and the
          # scan silently covers zero bytes. Don't try to optimise this back to depth=1 — it'll
          # look like it's working until the day a real secret slips through.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      # --redact keeps any match out of the run log, which is public on a public repo.
      # Range and flags copied from gitleaks-action's own Scan(): `--no-merges --first-parent
      # <base>^..<head>` keeps the scan to the PR's own commits. Refs go via env, not direct
      # ${{ }} interpolation, so nothing from the event can be injected into the shell.
      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts "--no-merges --first-parent ${BASE_SHA}^..${HEAD_SHA}"

      - name: Scan full history
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose
