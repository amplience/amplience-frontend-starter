# Gitleaks secret scanning.
#
# Two modes, picked by event:
#   - pull_request : scan only the PR diff (fast feedback for contributors)
#   - push to main : scan full git history (catches anything that slipped past PR scans
#                    and any direct pushes / merge edge cases)
#
# Config lives in .gitleaks.toml at the repo root. The job fails (non-zero exit) on any finding,
# which blocks merges when this workflow is added as a required check.
#
# Rationale: the original Quadratic codebase audit found ~7 credentials in history. Quadratic Lite
# is open-source from day one — a single leaked credential in `main` is effectively published. We
# fail closed.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; cancel superseded PR runs but never cancel `main` runs.
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # gitleaks-action calls GET /repos/{owner}/{repo}/pulls/{n}/commits to enumerate the
  # PR's commits when scanning a pull_request event. Without this scope, the GITHUB_TOKEN
  # gets a 403 "Resource not accessible by integration" and the action crashes before
  # the scan runs. Read is enough; bump to `write` only if we later want gitleaks to
  # post findings as PR comments.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for both events: gitleaks-action computes a base^..head
          # commit range locally and shells out to `git log`, so a shallow clone makes the
          # range unresolvable (parent-of-base isn't present) and the scan silently covers
          # zero bytes. Don't try to optimise this back to depth=1 — it'll look like it's
          # working until the day a real secret slips through.
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to the SHA for v2.3.9 — the org allowlist permits this exact ref, not @v2.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          # The action's diff-vs-full-history behaviour is driven by the event type:
          #   pull_request -> scans the PR diff only
          #   push         -> scans full history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # We intentionally don't set GITLEAKS_LICENSE — gitleaks-action only requires it for
          # organisations >25 users; Amplience is exempt under the OSS clause for public repos.
